name: Check BigQuery Transfer Failures

on:
  schedule:
    # 3:00 UTC = 5:00 CET — after transfers (00:30) and before dbt prod (04:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install python-dotenv

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check for failed transfers, fix, and trigger dbt
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_PROJECT_ID: metaflow-data
          BQ_DATASET: metaflow_application
          TRANSFER_LOCATION: europe
          S3_BUCKET: prod-metaflow-db-export-bucket
        run: |
          PROJECT_ID="metaflow-data"
          TRANSFER_LOCATION="europe"
          DATASET="metaflow_application"
          S3_BUCKET="prod-metaflow-db-export-bucket"

          # Find failed transfers (only output safe fields)
          FAILED=$(bq ls --transfer_config --transfer_location="$TRANSFER_LOCATION" --project_id="$PROJECT_ID" --format=json 2>/dev/null | python3 -c "
          import json, sys

          try:
              data = json.load(sys.stdin)
          except json.JSONDecodeError:
              print('ERROR: bq command did not return valid JSON', file=sys.stderr)
              sys.exit(1)

          if not data:
              print('ERROR: no transfers found', file=sys.stderr)
              sys.exit(1)

          failed = [t for t in data if t.get('state') == 'FAILED']

          for t in sorted(failed, key=lambda x: x.get('displayName', '')):
              name = t.get('displayName', 'unknown')
              updated = t.get('updateTime', 'unknown')
              print(f'{name}|{updated}')
          ")

          if [ -z "$FAILED" ]; then
            echo "All transfers healthy ✅"
            exit 0
          fi

          FAIL_COUNT=$(echo "$FAILED" | wc -l | tr -d ' ')
          echo "Found ${FAIL_COUNT} failed transfer(s), diagnosing..."

          # Collect table names for fix
          TABLE_NAMES=$(echo "$FAILED" | cut -d'|' -f1 | tr '\n' ' ' | sed 's/ $//')

          # Diagnose each failed transfer
          DIAGNOSIS=$(echo "$FAILED" | while IFS='|' read -r table_name updated; do
            echo "---DIAG_START---"
            echo "TABLE:${table_name}"
            echo "UPDATED:${updated}"

            BQ_COLS=$(bq show --schema --project_id="$PROJECT_ID" "${DATASET}.${table_name}" 2>/dev/null | python3 -c "
          import json, sys
          try:
              schema = json.load(sys.stdin)
              for f in schema:
                  print(f['name'])
          except:
              pass
          " 2>/dev/null)

            S3_COLS=$(aws s3 cp "s3://${S3_BUCKET}/${table_name}.csv" - 2>/dev/null | head -1 | tr ';' '\n')

            if [ -z "$BQ_COLS" ]; then
              echo "BQ_COUNT:unknown"
              echo "S3_COUNT:unknown"
              echo "STATUS:Could not read BQ schema"
            elif [ -z "$S3_COLS" ]; then
              echo "BQ_COUNT:$(echo "$BQ_COLS" | wc -l | tr -d ' ')"
              echo "S3_COUNT:unknown"
              echo "STATUS:Could not read S3 CSV header"
            else
              BQ_COUNT=$(echo "$BQ_COLS" | wc -l | tr -d ' ')
              S3_COUNT=$(echo "$S3_COLS" | wc -l | tr -d ' ')
              echo "BQ_COUNT:${BQ_COUNT}"
              echo "S3_COUNT:${S3_COUNT}"

              if [ "$BQ_COUNT" -eq "$S3_COUNT" ]; then
                echo "STATUS:Column count matches (${BQ_COUNT}) — issue may be data types or data content"
              else
                MISSING=$(comm -23 <(echo "$S3_COLS" | sort) <(echo "$BQ_COLS" | sort) | tr '\n' ', ' | sed 's/,$//')
                EXTRA=$(comm -13 <(echo "$S3_COLS" | sort) <(echo "$BQ_COLS" | sort) | tr '\n' ', ' | sed 's/,$//')

                if [ -n "$MISSING" ]; then
                  echo "MISSING_IN_BQ:${MISSING}"
                fi
                if [ -n "$EXTRA" ]; then
                  echo "EXTRA_IN_BQ:${EXTRA}"
                fi
                echo "STATUS:Schema mismatch — S3 has ${S3_COUNT} columns, BQ has ${BQ_COUNT}"
              fi
            fi
            echo "---DIAG_END---"
          done)

          # Build Slack diagnosis message
          MESSAGE=$(echo "$DIAGNOSIS" | python3 -c "
          import sys

          lines = sys.stdin.read().strip().split('\n')
          tables = []
          current = {}

          for line in lines:
              if line == '---DIAG_START---':
                  current = {}
              elif line == '---DIAG_END---':
                  if current:
                      tables.append(current)
              elif ':' in line:
                  key, _, value = line.partition(':')
                  current[key] = value

          parts = []
          parts.append(':rotating_light: *BigQuery Data Transfers Alert* — auto-fixing {len(tables)} failed transfer(s)\n')

          for t in tables:
              name = t.get('TABLE', 'unknown')
              status = t.get('STATUS', 'unknown')
              missing = t.get('MISSING_IN_BQ', '')
              extra = t.get('EXTRA_IN_BQ', '')

              parts.append(f'*\`{name}\`* — {status}')
              if missing:
                  parts.append(f'  + New in S3: \`{missing}\`')
              if extra:
                  parts.append(f'  - Removed from S3: \`{extra}\`')
              parts.append('')

          parts.append(':wrench: Running fix_tables.py automatically. The scheduled dbt prod run at 06:00 CET will pick up the fixes.')

          print('\n'.join(parts))
          ")

          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(echo "$MESSAGE" | python3 -c "import json,sys; print(json.dumps({'text': sys.stdin.read()}))")" \
            "$SLACK_WEBHOOK_URL"

          # Run fix_tables.py
          echo "Running: python3 fix_tables.py ${TABLE_NAMES}"
          python3 fix_tables.py ${TABLE_NAMES}
          FIX_EXIT=$?

          if [ $FIX_EXIT -ne 0 ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "$(python3 -c "import json; print(json.dumps({'text': ':x: fix_tables.py failed — manual intervention needed'}))")" \
              "$SLACK_WEBHOOK_URL"
            exit 1
          fi

          # Trigger manual backfill of the transfers (start a run now)
          echo "Triggering backfill for fixed transfers..."
          for table_name in ${TABLE_NAMES}; do
            CONFIG_ID=$(bq ls --transfer_config --transfer_location="$TRANSFER_LOCATION" --project_id="$PROJECT_ID" --format=json 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for t in data:
              if t.get('displayName') == '${table_name}':
                  print(t['name'])
                  break
          ")
            if [ -n "$CONFIG_ID" ]; then
              echo "Starting transfer run for ${table_name}..."
              bq mk --transfer_run --run_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CONFIG_ID" 2>/dev/null || true
            fi
          done

          # Notify Slack
          FIXED_LIST=$(echo "$TABLE_NAMES" | tr ' ' ', ')
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(python3 -c "import json; print(json.dumps({'text': ':white_check_mark: Tables fixed and backfill triggered: \`${FIXED_LIST}\`. The dbt prod run at 06:00 CET will rebuild downstream models.'}))")" \
            "$SLACK_WEBHOOK_URL"

          echo "Done — fix applied, dbt prod run at 04:00 UTC will pick up the changes"
